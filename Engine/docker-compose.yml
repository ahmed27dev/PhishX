services:

  gateway:
    build: ./gateway
    container_name: gateway
    ports:
      - "8000:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: phishingdb
      DB_USER: appuser
      DB_PASSWORD: apppass
      JWT_SECRET_KEY: supersecretkey
      PHISHING_SERVICE_URL: http://phishing-generator:8001
      AGENT_SERVICE_URL: http://agent-engine:8002   # ✅ ADD THIS
    depends_on:
      - postgres
      - phishing-generator
      - agent-engine
    networks:
      - internal


  phishing-generator:
    build: ./phishing-generator
    container_name: phishing-generator
    ports:
      - "8001:8001"
    environment:
      OLLAMA_URL: http://10.218.102.176:11434  
      OLLAMA_MODEL: phi3:mini
    networks:
      - internal


  agent-engine:
    build: ./agent-engine
    container_name: agent-engine
    ports:
      - "8002:8002"
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://appuser:apppass@postgres:5432/phishingdb   
      OLLAMA_URL: http://10.218.102.176:11434 
      OLLAMA_MODEL: phi3:mini
    networks:
      - internal


  simulation-portal:
    image: node:20-alpine
    container_name: simulation-portal
    networks:
      - internal


  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: phishingdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - internal


volumes:
  pgdata:


networks:
  internal:
    name: phishing_internal_net
    driver: bridge
